name: CI

# Lint (incl. file/function size limits, see docs/conventions.md) and typecheck
# every push and pull request, so oversized files can't land unnoticed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated, not committed; generate needs a URL but never connects.
      - name: Generate Prisma client
        run: npm --workspace apps/api run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint and size limits
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
