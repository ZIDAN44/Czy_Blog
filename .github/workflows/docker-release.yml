name: Build & Release Docker Images

# Builds the API and Dashboard images and publishes them to the GitHub
# Container Registry (GHCR). The image version is taken from the root
# package.json "version" field.
#
# Triggers:
#   - push to main             -> builds and pushes `:edge` + `:sha-<commit>`
#   - push of a `v*` git tag   -> builds, pushes versioned tags, creates a Release
#   - manual (workflow_dispatch) -> builds and pushes the package.json version
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.prettier*'
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Verify git tag matches package.json (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag (v${TAG_VERSION}) does not match package.json version (${PKG_VERSION})."
            exit 1
          fi

  # Build and push both images in parallel
  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: czyblog-api
            dockerfile: apps/api/Dockerfile
          - app: dashboard
            image: czyblog-dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image reference
        id: ref
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # Publish GitHub Release when a v* tag is pushed
  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker images

            Published to GitHub Container Registry:

            - `${{ env.REGISTRY }}/${{ github.repository_owner }}/czyblog-api:${{ needs.version.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ github.repository_owner }}/czyblog-dashboard:${{ needs.version.outputs.version }}`

            Pull the latest stable images:

            ```sh
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/czyblog-api:latest
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/czyblog-dashboard:latest
            ```
