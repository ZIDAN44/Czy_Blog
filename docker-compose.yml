# Docker Compose Configuration for Czy Blog
# Requires .env file with environment variables

services:
  # Postgres database
  postgres:
    image: postgres:18-alpine
    container_name: czyblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-czyblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-czyblog}
      POSTGRES_DB: ${POSTGRES_DB:-czyblog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - czyblog_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-czyblog} -d ${POSTGRES_DB:-czyblog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API service
  api:
    image: ghcr.io/zidan44/czyblog-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: czyblog-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-czyblog}:${POSTGRES_PASSWORD:-czyblog}@postgres:5432/${POSTGRES_DB:-czyblog}?schema=public
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"

  # Public reader site
  web:
    image: ghcr.io/zidan44/czyblog-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: czyblog-web
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      API_URL: http://api:${API_PORT:-4000}
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Admin console
  dashboard:
    image: ghcr.io/zidan44/czyblog-dashboard:latest
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: czyblog-dashboard
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      API_URL: http://api:${API_PORT:-4000}
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"

volumes:
  czyblog_pgdata:
